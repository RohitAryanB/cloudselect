<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudSelect Catalogue</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>

        body {
            background: #f5f7fb;
            font-family: Poppins, sans-serif;
            padding: 40px;
            color: #1e293b;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .catalogue {
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
            position: relative;
        }


        /* =========================
           PROFILE TOPBAR
        ========================= */

        .catalogue-topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }


        .profile-btn {
            border: none;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            padding: 7px 12px;
            border-radius: 10px;
            color: #334155;
            font-family: inherit;
        }


        .profile-btn:hover {
            background: #f1f5f9;
        }


        .profile-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }


        .profile-btn span {
            font-size: 13px;
            font-weight: 600;
        }


        .profile-btn i {
            font-size: 10px;
            color: #64748b;
        }


        /* =========================
           PROFILE MENU
        ========================= */

        .profile-menu {
            position: fixed;
            width: 220px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
            padding: 10px;
            z-index: 9999;
        }


        .profile-menu-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }


        .profile-menu-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }


        .profile-menu-user strong {
            display: block;
            font-size: 13px;
            color: #0f172a;
        }


        .profile-menu-user small {
            display: block;
            margin-top: 3px;
            color: #64748b;
            font-size: 10px;
        }


        .profile-menu-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 6px 0;
        }


        .profile-menu-logout {
            width: 100%;
            border: none;
            background: transparent;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #dc2626;
            font-family: inherit;
            font-size: 12px;
            text-align: left;
        }


        .profile-menu-logout:hover {
            background: #fef2f2;
        }


        /* =========================
           HEADER
        ========================= */

        .catalogue-header {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 30px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            width: max-content;
            background: #eff6ff;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .back-btn:hover {
            background: #dbeafe;
        }


        /* =========================
           PROVIDER HEADER
        ========================= */

        .provider-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }


        .provider-logo {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
        }


        h1 {
            font-size: 32px;
            margin: 0 0 8px;
            color: #0f172a;
        }


        .subtitle {
            color: #64748b;
            margin: 0;
        }


        /* =========================
           DASHBOARD BUTTON
        ========================= */

        .dashboard-btn {
            width: max-content;
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .dashboard-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           RIGHT BADGES
        ========================= */

        .header-badges {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .trial-badge {
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
        }


        .rating-box {
            background: #fff7ed;
            color: #ea580c;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
        }


        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin: 25px 0;
        }


        /* =========================
           BOXES
        ========================= */

        .box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .04);
        }


        .box h2 {
            font-size: 19px;
            margin-bottom: 15px;
            color: #0f172a;
        }


        .box p {
            color: #475569;
            line-height: 1.7;
        }


        /* =========================
           LISTS
        ========================= */

        ul {
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
        }


        li {
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #334155;
        }


        /* =========================
           FREE OFFERS
        ========================= */

        #trial p {
            background: #ecfdf5;
            color: #047857;
            padding: 10px 15px;
            border-radius: 12px;
            margin: 8px 0;
        }


        /* =========================
           PRICING
        ========================= */

        #pricing {
            font-size: 22px;
            font-weight: 700;
            color: #2563eb;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:768px) {

            body {
                padding: 20px;
            }


            .catalogue {
                padding: 25px;
            }


            .provider-info {
                flex-direction: column;
                align-items: flex-start;
            }


            .header-badges {
                flex-direction: column;
                align-items: flex-start;
            }


            .grid {
                grid-template-columns: 1fr;
            }


            .catalogue-topbar {
                margin-bottom: 15px;
            }

        }

    </style>

</head>


<body>


<div class="catalogue">


    <!-- =========================
         PROFILE
    ========================= -->

    <div class="catalogue-topbar">

        <button
            class="profile-btn"
            id="profile-btn"
            type="button">

            <div class="profile-circle">
                JD
            </div>

            <span>John Doe</span>

            <i class="fa-solid fa-chevron-down"></i>

        </button>

    </div>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="catalogue-header">


        <!-- BACK BUTTON -->

        <button
            class="back-btn"
            onclick="goBack()">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Catalogue

        </button>


        <!-- PROVIDER -->

        <div class="provider-info">


            <div
                class="provider-logo"
                id="provider-logo">
            </div>


            <div>

                <h1 id="provider-name"></h1>

                <p class="subtitle">
                    Complete overview of this cloud platform.
                </p>

            </div>


        </div>


        <!-- DASHBOARD -->

        <button
            class="dashboard-btn"
            id="dashboard-btn"
            type="button">

            <i class="fa-solid fa-chart-line"></i>

            Open Dashboard

        </button>


        <!-- BADGES -->

        <div class="header-badges">


            <div
                class="trial-badge"
                id="trial-badge">
            </div>


            <div class="rating-box">

                ⭐

                <span id="rating"></span>

            </div>


        </div>


    </div>


    <!-- =========================
         OVERVIEW
    ========================= -->

    <div class="box">

        <h2>Overview</h2>

        <p id="overview"></p>

    </div>


    <!-- =========================
         PRICING + FREE OFFERS
    ========================= -->

    <div class="grid">


        <!-- PRICING -->

        <div class="box">

            <h2>Pricing</h2>

            <div id="pricing"></div>

            <br>

            <a
                id="pricing-link"
                class="back-btn"
                target="_blank"
                style="text-decoration:none;">

                <i class="fa-solid fa-calculator"></i>

                Pricing Calculator

            </a>

        </div>


        <!-- FREE OFFERS -->

        <div class="box">

            <h2>Free Offers</h2>

            <div id="trial"></div>

        </div>


    </div>


    <!-- =========================
         SERVICES
    ========================= -->

    <div class="box">

        <h2>Popular Services</h2>

        <ul id="services"></ul>

    </div>


    <!-- =========================
         WORKLOADS
    ========================= -->

    <div class="box">

        <h2>Primary Workloads</h2>

        <ul id="workloads"></ul>

    </div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/data.js"></script>

<script src="js/catalogue.js"></script>


</body>

</html>
